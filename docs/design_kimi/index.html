<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E-Chat · Tablet & Desktop — макеты</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<style>
  /* Оболочка просмотрщика (не часть макетов) */
  .viewer { display: flex; height: 100vh; }
  .vside {
    width: 264px; flex: none; background: var(--viewer-panel);
    border-right: 1px solid var(--viewer-border);
    overflow-y: auto; padding: 14px 10px;
  }
  .vside h1 { font-size: 15px; font-weight: 700; padding: 4px 10px 2px; }
  .vside .sub { font-size: 11.5px; color: var(--viewer-dim); padding: 0 10px 14px; }
  .vgroup { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--viewer-dim); padding: 14px 10px 6px; }
  .vitem {
    display: block; width: 100%; text-align: left; border: 0; cursor: pointer;
    background: none; color: var(--viewer-text); font: inherit; font-size: 13.5px;
    padding: 8px 10px; border-radius: 8px;
  }
  .vitem:hover { background: #2a2b33; }
  .vitem.active { background: #1565C0; color: #fff; }
  .vmain { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .vtoolbar {
    height: 60px; flex: none; display: flex; align-items: center; gap: 16px;
    padding: 0 18px; border-bottom: 1px solid var(--viewer-border);
    background: var(--viewer-panel);
  }
  .vtoolbar .ttl { font-size: 14.5px; font-weight: 600; }
  .vtoolbar .note { font-size: 12px; color: var(--viewer-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vseg { display: flex; background: #17181d; border: 1px solid var(--viewer-border); border-radius: 10px; padding: 3px; gap: 3px; }
  .vseg button {
    border: 0; background: none; color: var(--viewer-dim); font: inherit; font-size: 12.5px; font-weight: 600;
    padding: 6px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap;
  }
  .vseg button.on { background: #1565C0; color: #fff; }
  .vpush { flex: 1; }
  .vcanvas {
    flex: 1; overflow: auto; position: relative;
    background: var(--viewer-bg);
    background-image: radial-gradient(circle, #2c2d36 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .vscaler { position: absolute; top: 0; left: 0; transform-origin: top left; }
  .vframe-wrap { padding: 32px; }
  .frame { box-shadow: 0 32px 80px rgba(0,0,0,.5); }
  .vcap { text-align: center; color: var(--viewer-dim); font-size: 12px; padding-top: 14px; }
  kbd {
    background: #2a2b33; border-radius: 4px; padding: 1px 6px; font-size: 11px;
    border: 1px solid var(--viewer-border); font-family: inherit;
  }
</style>
</head>
<body>
<div class="viewer">
  <aside class="vside">
    <h1>E-Chat · Tablet & Desktop</h1>
    <div class="sub">Макеты по мотивам мобильного Figma-кита<br/><kbd>↑</kbd><kbd>↓</kbd> экраны · <kbd>T</kbd> тема · <kbd>F</kbd> форм-фактор</div>
    <div id="screenList"></div>
  </aside>
  <main class="vmain">
    <div class="vtoolbar">
      <div>
        <div class="ttl" id="capTitle"></div>
        <div class="note" id="capNote"></div>
      </div>
      <div class="vpush"></div>
      <div class="vseg" id="ffSeg">
        <button data-ff="tablet">Tablet · 768×1024</button>
        <button data-ff="tabletL">Tablet L · 1024×768</button>
        <button data-ff="desktop">Desktop · 1440×900</button>
      </div>
      <div class="vseg" id="themeSeg">
        <button data-theme="light">☀ Light</button>
        <button data-theme="dark">🌙 Dark</button>
      </div>
    </div>
    <div class="vcanvas" id="canvas">
      <div class="vscaler" id="scaler">
        <div class="vframe-wrap">
          <div class="frame" id="frame"><div class="app" id="app"></div></div>
          <div class="vcap" id="capSize"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="screens.js"></script>
<script>
(function () {
  const state = { screen: 'chats-conversation', ff: 'desktop', theme: 'light' };

  // Восстановление состояния из location.hash (#screen/ff/theme)
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('screen') && SCREENS.some(s => s.id === h.get('screen'))) state.screen = h.get('screen');
  if (['tablet', 'tabletL', 'desktop'].includes(h.get('ff'))) state.ff = h.get('ff');
  if (h.get('theme') === 'light' || h.get('theme') === 'dark') state.theme = h.get('theme');

  const $ = id => document.getElementById(id);

  // Список экранов с группировкой
  const list = $('screenList');
  let lastGroup = null;
  SCREENS.forEach(s => {
    if (s.group !== lastGroup) {
      lastGroup = s.group;
      const g = document.createElement('div');
      g.className = 'vgroup'; g.textContent = s.group;
      list.appendChild(g);
    }
    const b = document.createElement('button');
    b.className = 'vitem'; b.textContent = s.title; b.dataset.id = s.id;
    b.onclick = () => { state.screen = s.id; render(); };
    list.appendChild(b);
  });

  $('ffSeg').querySelectorAll('button').forEach(b => b.onclick = () => { state.ff = b.dataset.ff; render(); });
  $('themeSeg').querySelectorAll('button').forEach(b => b.onclick = () => { state.theme = b.dataset.theme; render(); });

  document.addEventListener('keydown', e => {
    if (e.key === 't' || e.key === 'T' || e.key === 'е' || e.key === 'Е') { state.theme = state.theme === 'light' ? 'dark' : 'light'; render(); }
    if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') {
      const order = ['tablet', 'tabletL', 'desktop'];
      state.ff = order[(order.indexOf(state.ff) + 1) % order.length];
      render();
    }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const i = SCREENS.findIndex(s => s.id === state.screen);
      const n = (i + (e.key === 'ArrowDown' ? 1 : -1) + SCREENS.length) % SCREENS.length;
      state.screen = SCREENS[n].id; render(); e.preventDefault();
    }
  });

  function fitScale() {
    const canvas = $('canvas'), frame = $('frame');
    const pad = 64;
    const s = Math.min((canvas.clientWidth - pad) / frame.offsetWidth, (canvas.clientHeight - pad) / frame.offsetHeight, 1);
    const scale = s < 1 ? s : 1;
    $('scaler').style.transform = `scale(${scale})`;
    // Центрирование с учётом масштаба
    const w = frame.offsetWidth * scale + pad;
    const hgt = frame.offsetHeight * scale + pad + 30;
    $('scaler').style.width = w + 'px';
    $('scaler').style.height = hgt + 'px';
    const wrap = document.querySelector('.vframe-wrap');
    wrap.style.width = w / scale + 'px';
  }
  window.addEventListener('resize', fitScale);

  function render() {
    const scr = SCREENS.find(s => s.id === state.screen);
    const frame = $('frame');
    frame.className = 'frame ' + state.ff;
    frame.dataset.theme = state.theme;
    $('app').innerHTML = scr.render(state.ff);
    $('capTitle').textContent = scr.title;
    $('capNote').textContent = scr.note;
    const sizes = { tablet: '768 × 1024', tabletL: '1024 × 768', desktop: '1440 × 900' };
    $('capSize').textContent = sizes[state.ff] + ' · ' + (state.theme === 'light' ? 'Light' : 'Dark');
    document.querySelectorAll('.vitem').forEach(b => b.classList.toggle('active', b.dataset.id === state.screen));
    $('ffSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.ff === state.ff));
    $('themeSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.theme === state.theme));
    location.hash = `screen=${state.screen}&ff=${state.ff}&theme=${state.theme}`;
    requestAnimationFrame(fitScale);
  }
  render();
})();
</script>
</body>
</html>
