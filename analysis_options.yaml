include: package:flutter_lints/flutter.yaml

# Плагин анализатора Riverpod (без custom_lint).
# Версия должна быть совместима с riverpod_lint в pubspec.yaml.
plugins:
  riverpod_lint: ^3.1.9

analyzer:
  exclude:
    # Кэш Dart/Flutter — не анализируем.
    - .dart_tool/**
    # Артефакты сборки.
    - build/**
    # Codegen (json_serializable, riverpod_generator и т.п.).
    - '**/*.g.dart'
    # Codegen Freezed.
    - '**/*.freezed.dart'
  language:
    # Запрещает неявные downcast'ы (Object → T без as).
    strict-casts: true
    # Требует явный тип, если его нельзя однозначно вывести.
    strict-inference: true
    # Запрещает «сырые» generic-типы без параметров (List вместо List<T>).
    strict-raw-types: true
  errors:
    # Обязательный параметр не передан — ошибка, не warning.
    missing_required_param: error
    # Функция без return там, где он нужен — ошибка.
    missing_return: error
    # Freezed + json_serializable: @JsonKey и др. на полях дают ложные срабатывания.
    invalid_annotation_target: ignore

linter:
  rules:
    # Единый стиль строк: 'текст' вместо "текст".
    prefer_single_quotes: true
    # Запятая после последнего аргумента — удобнее diff и форматирование.
    require_trailing_commas: true
    # Не использовать print; для отладки — debugPrint / логгер.
    avoid_print: true
    # Предпочитать const-конструкторы, где возможно.
    prefer_const_constructors: true
    # const для литералов коллекций в const-контексте.
    prefer_const_literals_to_create_immutables: true
    # SizedBox вместо Container только для ширины/высоты.
    sized_box_for_whitespace: true
    # Key у виджетов с конструктором — стабильность в списках/дереве.
    use_key_in_widget_constructors: true
    # Не оборачивать в Container без нужды (padding/color/decoration).
    avoid_unnecessary_containers: true
