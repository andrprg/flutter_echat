name: flutter_echat_widgetbook
description: Песочница Widgetbook для dumb-виджетов E-Chat.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_echat:
    path: ../
  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  widgetbook_generator: ^3.24.0
  # Нужен здесь: при сборке Widgetbook трансформируются SVG из path-зависимости flutter_echat.
  vector_graphics_compiler: ^1.3.0

flutter:
  uses-material-design: true
