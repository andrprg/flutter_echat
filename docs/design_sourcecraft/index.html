  <style>
    /* Материальные глифы рисуются fill; поверх токенов */
    .ic { fill: currentColor; stroke: none; }

    /* Строка состояний экрана (Empty / Filled / …) */
    .state-nav {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      margin: -8px 0 14px; padding-left: 4px; min-height: 30px;
    }
    .state-nav .st-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: #686a8a; margin-right: 6px; }
    .state-chip {
      font-family: inherit; font-size: 12px; font-weight: 500; color: #e8e9ee;
      background: #292a31; border: 1px solid #3a3b44; border-radius: 16px;
      padding: 5px 12px; cursor: pointer;
    }
    .state-chip.active { background: #40c4ff; border-color: #40c4ff; color: #0d1217; font-weight: 600; }

    /* Аватар группы: квадрат с градиентом */
    .gav {
      width: 48px; height: 48px; border-radius: 16px; flex: none;
      display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px;
    }
    .gav.lg { width: 96px; height: 96px; border-radius: 28px; font-size: 28px; }
    .gav.c1 { background: linear-gradient(135deg, #1565c0, #40c4ff); }
    .gav.c2 { background: linear-gradient(135deg, #f5576c, #f093fb); }
    .gav.c3 { background: linear-gradient(135deg, #43e97b, #38f9d7); }
    .gav.c4 { background: linear-gradient(135deg, #fa709a, #fee140); }

    /* Компактный input в диалогах */
    .input.compact { padding: 10px 12px; }

    /* Overlay-панель info на tablet (справа, как push) */
    .info-overlay {
      position: absolute; top: 0; right: 0; bottom: 0; z-index: 8;
      width: 320px; display: flex; flex-direction: column;
      background: var(--surface); border-left: 1px solid var(--divider);
      box-shadow: -24px 0 64px rgba(0,0,0,.25);
    }

    /* Сплит auth: декоративные блоки */
    .deco-a { width: 210px; height: 210px; top: 90px; left: -70px; }
    .deco-b { width: 130px; height: 130px; bottom: 60px; right: -40px; }
    .deco-c { width: 64px; height: 64px; top: 40%; right: 48px; border-radius: 18px !important; }

    /* Bubble кастомного цвета (специфичнее стандартного out-градиента) */
    .msg-row.out .bubble.coral { background: linear-gradient(135deg, #ff6347, #e04a2f); }
    .msg-row.out .bubble.indigo { background: linear-gradient(135deg, #5c6bc0, #3f51b5); }
    .msg-row.out .bubble.emerald { background: linear-gradient(135deg, #26a69a, #00897b); }

    /* Пустой список-результат поиска */
    .no-results { padding: 34px 20px; text-align: center; color: var(--on-variant); font-size: 13.5px; }

    /* Текстовая страница (Privacy / Terms) */
    .legal-scroll { flex: 1; overflow: hidden; padding: 26px 40px 40px; }
    .legal-inner { max-width: 720px; margin: 0 auto; }
    .legal-inner h2 { font-size: 22px; font-weight: 700; margin: 22px 0 8px; }
    .legal-inner h2:first-child { margin-top: 0; }
    .legal-inner p { font-size: 14px; color: var(--on-variant); margin-bottom: 10px; line-height: 1.65; }
    .legal-inner ul { margin: 0 0 12px 20px; }
    .legal-inner li { font-size: 14px; color: var(--on-variant); line-height: 1.6; }

    /* Тайлы групп: стек аватаров участников */
    .stack { display: flex; }
    .stack .av { border: 2px solid var(--surface); margin-left: -8px; }
    .stack .av:first-child { margin-left: 0; }
  </style>
</head>

    }

    /* Экран настройки безопасности (Face / Touch / PIN) */
    function securitySetup(device, kind, state) {
      const titles = { face: "Face ID", touch: "Touch ID", pin: "PIN Security" };
      const title = titles[kind];
      const iconName = { face: "face", touch: "lock", pin: "key" }[kind];
      const descr = {
        face: "Use your face to unlock E-Chat and confirm payments.",
        touch: "Use your fingerprint to unlock E-Chat quickly.",
        pin: "Create a 4-digit PIN to protect your account."
      };
      const scan = state === "scanning";
      const done = state === "done";
      let body = "";
      if (kind === "pin") {
        const dots = Array.from({ length: 4 }, (_, i) => `<i class="${scan ? (i === 2 ? "caret" : "on") : ""}"></i>`).join("");
        body = `<div class="pin-dots">${dots}</div>
          <div class="sub" style="text-align:center;max-width:280px;margin:14px auto 0;">${scan ? "Enter your new PIN" : done ? "PIN successfully set up" : "Create your PIN — it will be required every time you open E-Chat."}</div>`;
      } else if (scan) {
        body = `<div class="scan-stage"><div class="scan-box">${icon(iconName, 64)}<span class="scan-line"></span></div></div>
          <div class="sub" style="text-align:center;max-width:280px;margin:22px auto 0;">Place your ${kind === "face" ? "face" : "finger"} on the sensor…</div>`;
      } else if (done) {
        body = `<div style="display:grid;place-items:center;padding:10px 0 6px;">
          <div class="btn-circle grad-light-blue" style="width:96px;height:96px;">${icon("check", 46)}</div>
          <div style="font-size:19px;font-weight:700;margin-top:18px;">${title} enabled</div>
          <div class="sub" style="margin-top:4px;">Your account is now protected.</div>
        </div>`;
      } else {
        body = `<div class="scan-stage" style="width:180px;height:180px;"><div class="scan-box" style="border-style:solid;border-color:var(--outline);color:var(--on-variant);">${icon(iconName, 56)}</div></div>
          <div class="sub" style="text-align:center;max-width:300px;margin:20px auto 0;">${descr[kind]}</div>`;
      }
      return singleScreen(device, "more", title,
        `<div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px;">${body}
           ${!done ? `<button class="btn-primary" style="max-width:320px;margin-top:26px;">${state === "scanning" ? "Continue" : "Enable " + title}</button>` : `<button class="btn-tonal" style="margin-top:22px;">Done</button>`}
         </div>`);
    }

              ${item("key", "background:var(--primary-container);color:var(--primary);", "Change PIN")}
              ${item("face", "background:var(--secondary-container);color:var(--secondary);", "Face ID", `<button class="tgl" style="margin-right:2px;"></button>`)}
              ${item("lock", "background:var(--primary-container);color:var(--primary);", "Touch ID", `<button class="tgl on" style="margin-right:2px;"></button>`)}
            </div>
            <p style="font-size:12.5px;color:var(--on-variant);margin-top:16px;line-height:1.6;">Protect E-Chat with an extra layer of security. Your biometrics never leave this device.</p>`);
        }
      },
      "notif": {
        name: "Setting · Notification", states: null,
        render: (c) => {
          const row = (label, sub, on) => `<div class="notif-row"><div class="lbl">${label}${sub ? `<div class="sub">${sub}</div>` : ""}</div><button class="tgl ${on ? "on" : ""}"></button></div>`;
          return singleScreen(c.device, "more", "Notifications", `
            <div class="menu-list">
              ${row("Notifications", "Show notifications on this device", true)}
              ${row("Message notifications", "Sound and banner for direct chats", true)}
              ${row("Group notifications", "Only for mentioned messages", false)}
              ${row("Calls", "Ring for incoming calls", true)}
              ${row("Sounds", "Play sounds for messages", false)}
              ${row("Badge count", "Show unread count on app icon", true)}
            </div>`);
        }
      },
      "faceid": { name: "Setting · Face ID", states: ["setup", "scanning", "done"], render: (c) => securitySetup(c.device, "face", c.state) },
      "touchid": { name: "Setting · Touch ID", states: ["setup", "scanning", "done"], render: (c) => securitySetup(c.device, "touch", c.state) },
      "pin": { name: "Setting · PIN", states: ["setup", "scanning", "done"], render: (c) => securitySetup(c.device, "pin", c.state) },
      "help": {
        name: "Help Center", states: ["list", "detail"],
        render: (c) => {
          const q = (q, ans) => `<div class="help-item"><div class="lbl">${q}${c.state === "detail" ? `<div class="ans">${ans}</div>` : ""}</div><span class="chev">›</span></div>`;
          if (c.state === "detail") {
            return singleScreen(c.device, "more", "How to reset my PIN?", `
              <div class="menu-list" style="margin-top:0;">
                ${q("How to reset my PIN?", "Open Settings → Security → Change PIN. Enter your current PIN, then choose a new one. If you forgot the PIN, use Face ID or Touch ID to verify your identity first.")}
              </div>
              <div class="menu-list" style="margin-top:16px;">
                <div class="help-item"><div class="lbl">Was this helpful?</div><button class="btn-tonal" style="padding:8px 22px;font-size:14px;">Yes 👍</button></div>
              </div>`);
          }
          return singleScreen(c.device, "more", "Help Center", `
            <div class="input compact" style="margin-top:0;">${icon("search", 20)}<input placeholder="Search articles…" readonly /></div>
            <div class="menu-list" style="margin-top:16px;">
              ${q("How to reset my PIN?", "")}
              ${q("Messages aren’t syncing", "")}
              ${q("Enable Face ID / Touch ID", "")}
              ${q("Recover a deleted chat", "")}
              ${q("Group calls not working", "")}
              ${q("Change phone number", "")}
            </div>`);
        }
      },
      "legal": {
        name: "Legal", states: ["privacy", "terms"],
        render: (c) => {
          const body = c.state === "privacy" ? `
            <h2>Privacy Policy</h2>
            <p>E-Chat is designed to protect your privacy. This policy explains what data we collect, why we collect it, and how you can control it.</p>
            <h2>1. Information we collect</h2>
            <p>We collect the minimal information required to provide the service: your phone number, profile name and photo, and message metadata.</p>
            <h2>2. How we use information</h2>
            <ul><li>To deliver messages and calls</li><li>To keep your account secure</li><li>To improve reliability of the service</li></ul>
            <h2>3. Encryption</h2>
            <p>All messages are protected with end-to-end encryption by default. We cannot read your conversations.</p>
            <h2>4. Your rights</h2>
            <p>You can export or delete your data at any time from Settings → Privacy & Security.</p>` : `
            <h2>Terms of Service</h2>
            <p>By using E-Chat you agree to these terms. Please read them carefully before creating an account.</p>
            <h2>1. Acceptable use</h2>
            <ul><li>Do not spam or harass other users</li><li>Do not distribute malware or illegal content</li><li>Do not attempt to break the service</li></ul>
            <h2>2. Accounts</h2>
            <p>You are responsible for keeping your device and account credentials safe. Report lost devices immediately.</p>
            <h2>3. Termination</h2>
            <p>We may suspend accounts that violate these terms. You may stop using the service at any time.</p>`;
          return chrome(c.device, "more") + `<div class="single">
            <div class="single-head"><button class="icon-btn">${icon("back", 22)}</button><div class="t">${c.state === "privacy" ? "Privacy Policy" : "Terms of Service"}</div><button class="icon-btn">${icon("more", 22)}</button></div>
            <div class="legal-scroll"><div class="legal-inner">${body}</div></div>
          </div>`;
        }
      },

      /* ── Calls ──────────────────────────────────────────────────── */
      "call": { name: "Chats · Call", states: null, render: (c) => callScreens(c.device, "call") },
      "calling": { name: "Chats · Calling", states: null, render: (c) => callScreens(c.device, "calling") },
      "video": { name: "Video Calling", states: null, render: (c) => callScreens(c.device, "video") }
    };

    /* =========================================================================
       Секции (для навигации по чипам)
       ========================================================================= */
    const SECTIONS = [
      { name: "Onboarding", ids: ["loading", "introduce"] },
      { name: "Auth", ids: ["login", "login-otp", "signup", "signup-otp", "signup-user"] },
      { name: "Chats", ids: ["chats", "chat-conv", "chat-typing", "chat-custom", "chat-search", "chat-add", "userinfo", "groupinfo"] },
      { name: "Groups", ids: ["groups", "group-conv"] },
      { name: "Add", ids: ["add-friend", "create-group"] },
      { name: "Profile", ids: ["profile", "more", "invite", "security", "notif", "faceid", "touchid", "pin", "help", "legal"] },
      { name: "Calls", ids: ["call", "calling", "video"] }
    ];

    /* =========================================================================
       Viewer state & render
       ========================================================================= */
    let device = "desktop";
    let theme = "light";
    let current = "chats";
    let state = null;

    const frameEl = document.getElementById("frame");
    const navEl = document.getElementById("screenNav");
    const stateEl = document.getElementById("stateNav");
    const labelEl = document.getElementById("frameLabel");

    function allIds() { return SECTIONS.flatMap((s) => s.ids); }

    function buildNav() {
      navEl.innerHTML = SECTIONS.map((sec) =>
        `<span class="section-tag">${sec.name}</span>` + sec.ids.map((id) =>
          `<button class="chip ${id === current ? "active" : ""}" data-id="${id}">${SCREENS[id].name}</button>`).join("")
      ).join("");
      navEl.querySelectorAll(".chip").forEach((ch) =>
        ch.addEventListener("click", () => { current = ch.dataset.id; state = null; render(); buildNav(); }));
    }

    function buildStateNav() {
      const scr = SCREENS[current];
      if (!scr.states) { stateEl.innerHTML = ""; return; }
      if (!state) state = scr.states[0];
      stateEl.innerHTML = `<span class="st-label">State:</span>` + scr.states.map((s) =>
        `<button class="state-chip ${s === state ? "active" : ""}" data-state="${s}">${s}</button>`).join("");
      stateEl.querySelectorAll(".state-chip").forEach((ch) =>
        ch.addEventListener("click", () => { state = ch.dataset.state; render(); buildStateNav(); }));
    }

    function render() {
      const scr = SCREENS[current];
      frameEl.className = "frame " + device;
      frameEl.dataset.theme = theme;
      frameEl.innerHTML = `<div class="app">${scr.render({ device, theme, state })}</div>`;
      labelEl.textContent = `${scr.name} · ${device === "tablet" ? "Tablet 768×1024" : "Desktop 1440×900"} · ${theme === "light" ? "Light" : "Dark"} theme`;
      document.getElementById("frameLabel").style.display = "block";
      buildStateNav();
    }

    /* Управление */
    document.getElementById("deviceGroup").addEventListener("change", (e) => {
      device = e.target.value; render();
    });
    document.getElementById("themeGroup").addEventListener("change", (e) => {
      theme = e.target.value; render();
    });
    document.getElementById("prevBtn").addEventListener("click", () => step(-1));
    document.getElementById("nextBtn").addEventListener("click", () => step(1));
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
    });

    function step(dir) {
      const ids = allIds();
      const idx = ids.indexOf(current);
      current = ids[(idx + dir + ids.length) % ids.length];
      state = null;
      render(); buildNav();
    }

    buildNav();
    render();

    /* Самопроверка: ?selftest=1 → прогоняет все экраны × форм-факторы × темы */
    if (new URLSearchParams(location.search).get("selftest") === "1") {
      const probe = document.createElement("div");
      probe.style.cssText = "position:absolute;left:-99999px;top:0;";
      document.body.appendChild(probe);
      let pass = 0, fail = 0;
      ["tablet", "desktop"].forEach((d) => {
        ["light", "dark"].forEach((t) => {
          Object.keys(SCREENS).forEach((id) => {
            const scr = SCREENS[id];
            const states = scr.states || [null];
            states.forEach((s) => {
              try {
                probe.innerHTML = `<div class="frame ${d}" data-theme="${t}"><div class="app">${scr.render({ device: d, theme: t, state: s })}</div></div>`;
                pass++;
              } catch (err) {
                fail++;
                console.error("SELFTEST FAIL", id, d, t, s, err && err.message);
              }
            });
          });
        });
      });
      probe.remove();
      console.log("SELFTEST done — pass:", pass, "fail:", fail);
    }
  </script>
</body>
</html>
